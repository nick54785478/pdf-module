spring.application.name=openpdf-module

# Character Encoding & Logging Charset
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true
logging.charset.console=UTF-8
logging.charset.file=UTF-8

# SpringDoc OpenAPI & Swagger UI Configuration
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.display-request-duration=true

# PDF Engine Configuration: Fully adopted Apache PDFBox 3.x for Security & Digital Signatures

# ==============================================================================
# PDF Font Configuration (字型路徑配置)
# ==============================================================================
# 預設中文字型 Classpath 相對路徑 (包含副檔名，如微軟正黑體 Light)
pdf.font.path=fonts/MSJHL.TTC
# 開發環境本機資源相對路徑備援
pdf.font.dev-fallback-path=src/main/resources/fonts/MSJHL.TTC
# 作業系統層級本機系統字型絕對路徑備援
pdf.font.system-fallback-path=C:/Windows/Fonts/msjh.ttc